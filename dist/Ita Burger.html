<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>/* Reset mínimo (safe-area / viewport) — extraído da <style> do <head> original */
:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}
</style></head><body><title>Ita Burger</title><meta name="claude:viewport-fit-sides" content="cover"><link id="ita-fonts" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&family=Bowlby+One&display=swap"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><style id="ita-css">/* Ita Burger — estilos (extraído de #ita-css no arquivo único) */
/* Layout: balcão de lanchonete à noite. Faixa de aviso fina no topo, cabeçalho fixo, hero com o pinguim, abas de categoria fixas e cartões de produto. Carrinho e administração abrem em tela cheia. */
:root{
  --black:#000; --coal:#110e0e; --coal2:#1b1616; --line:#302828;
  --cream:#fef4eb; --muted:#b8aba0; --gold:#f2aa17; --gold-d:#c27f00; --red:#b5253b; --red-hi:#e04a60;
  --bad:#ff8a8a; --good:#5fd08a;
  --display:'Bowlby One','Arial Black',Impact,sans-serif;
  --body:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
  --label:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;
  --hh:58px;
  --cartbar-h:env(safe-area-inset-bottom,0px);
  color-scheme:dark;
}
body.has-cart{--cartbar-h:calc(72px + env(safe-area-inset-bottom,0px))}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{background:var(--black);color:var(--cream);font:16px/1.45 var(--body);-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--black);z-index:40}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,h4,p{overflow-wrap:anywhere}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.wrap{width:100%;max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sp{flex:1}
.lbl{font:700 13px/1.1 var(--label);letter-spacing:.13em;text-transform:uppercase;color:var(--muted)}
.note{color:var(--muted);font-size:14.5px;margin:0}

/* botões */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 20px;border-radius:999px;border:2px solid transparent;font:700 16px/1 var(--label);letter-spacing:.07em;text-transform:uppercase;text-decoration:none;white-space:nowrap;background:none}
.btn-sm{min-height:38px;padding:0 15px;font-size:14.5px}
.btn-gold{background:var(--gold);color:#000}
.btn-red{background:var(--red);color:var(--cream)}
.btn-line{border-color:var(--line);color:var(--cream)}
.btn-line:hover{border-color:var(--gold)}
.btn-danger{border-color:#6b2a33;color:var(--bad)}
.btn-wa{background:#25d366;color:#000;width:100%;min-height:56px;font-size:18px;white-space:normal;text-align:center}
.btn[disabled]{opacity:.45;cursor:not-allowed}

/* faixa de anúncio e aviso de rascunho */
.ads{background:var(--gold);color:#000;font:700 14px/1.2 var(--label);letter-spacing:.08em;text-transform:uppercase;text-align:center}
.ads .wrap{min-height:34px;display:flex;align-items:center;justify-content:center;padding-block:7px}
.ads a{color:inherit;text-decoration:underline;text-underline-offset:3px}
.draftbar{background:var(--red);color:var(--cream);font:600 15px/1.3 var(--body)}
.draftbar .wrap{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding-block:8px}

/* cabeçalho */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--black);border-bottom:1px solid var(--line)}
.top .wrap{height:var(--hh);display:flex;align-items:center;gap:10px}
.brand{height:44px;width:auto;display:block}
.cnt{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 6px;border-radius:99px;background:var(--cream);color:var(--red);font:700 14px/1 var(--label)}

/* hero */
.hero{background:#000;border-bottom:1px solid var(--line)}
.hero .wrap{display:grid;grid-template-columns:minmax(0,1fr);gap:6px;align-items:center;padding-block:18px 24px}
.hero-img{display:block;width:min(74%,320px);margin:0 auto;-webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 16%);mask-image:linear-gradient(to bottom,transparent 0,#000 16%)}
.eyebrow{font:700 14px/1 var(--label);letter-spacing:.2em;text-transform:uppercase;color:var(--gold);margin:0}
.hero h1{font:400 clamp(30px,8vw,54px)/1.04 var(--display);margin:10px 0 12px;text-wrap:balance}
.hero h1 em{font-style:normal;color:var(--red-hi)}
.hero p.lead{color:var(--muted);max-width:44ch;margin:0 0 18px}
.hero-cta{display:flex;gap:10px;flex-wrap:wrap}
@media (min-width:780px){
  .hero .wrap{grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:28px;padding-block:32px}
  .hero-img{order:2;width:100%;max-width:440px}
}

/* abas */
.tabs{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--hh));z-index:25;background:var(--black);border-bottom:1px solid var(--line)}
.tabs .wrap{display:flex;gap:8px;overflow-x:auto;padding-block:10px;scrollbar-width:none}
.tabs .wrap::-webkit-scrollbar{display:none}
.tab{flex:none;display:inline-flex;align-items:center;gap:8px;min-height:42px;padding:0 15px 0 11px;border-radius:999px;border:1.5px solid var(--line);background:var(--coal);font:700 15.5px/1 var(--label);letter-spacing:.07em;text-transform:uppercase}
.tab svg{width:24px;height:24px}
.tab.build{background:var(--red);border-color:var(--red-hi)}
.tab[aria-selected=true]{background:var(--gold);border-color:var(--gold);color:#000}
#view{scroll-margin-top:calc(var(--hh) + 66px + env(safe-area-inset-top,0px));min-height:40vh}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:24px 14px}
.sec-h h2{font:400 clamp(24px,5.5vw,36px)/1.05 var(--display);margin:0}
.sec-h span{font:600 14px/1 var(--label);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}

/* produtos */
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr));padding-bottom:28px}
.card{display:grid;grid-template-columns:64px minmax(0,1fr);gap:8px 14px;padding:14px;background:var(--coal);border:1px solid var(--line);border-radius:14px}
.tile{width:64px;height:64px;border-radius:12px;display:grid;place-items:center;background:radial-gradient(circle at 30% 22%,#4b3309,#1a1310 72%);border:1px solid #3d2f14}
.tile svg{width:42px;height:42px}
.card h3{margin:2px 0 0;font:400 17px/1.15 var(--display);text-wrap:balance}
.card p{margin:5px 0 0;color:var(--muted);font-size:14.5px;line-height:1.35}
.buy{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:10px}
.price{font:700 23px/1 var(--label);color:var(--gold);letter-spacing:.02em;font-variant-numeric:tabular-nums;white-space:nowrap}
.step{display:inline-flex;align-items:center;border:1.5px solid var(--gold);border-radius:999px;padding:2px}
.step button{width:38px;height:36px;border-radius:99px;border:0;background:none;color:var(--gold);font:700 22px/1 var(--label)}
.step b{min-width:28px;text-align:center;font:700 19px/1 var(--label);font-variant-numeric:tabular-nums}
.empty{padding:40px 0;display:grid;gap:12px;justify-items:start}
.empty h3{margin:0;font:400 22px var(--display)}

/* monte o seu */
.bgroup{padding:16px 0 18px;border-top:1px solid var(--line)}
.bgroup h3{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin:0 0 12px;font:400 19px/1.1 var(--display)}
.bgroup h3 small{font:600 13px/1 var(--label);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.opts{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(min(100%,240px),1fr))}
.opt{display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:50px;padding:10px 14px;text-align:left;border-radius:12px;border:1.5px solid var(--line);background:var(--coal)}
.opt .nm{display:flex;align-items:center;gap:10px;min-width:0}
.dot{flex:none;width:20px;height:20px;border-radius:50%;border:2px solid var(--muted)}
.opt.multi .dot{border-radius:6px}
.opt .pr{font:700 15.5px/1 var(--label);color:var(--gold);white-space:nowrap}
.opt .pr.free{color:var(--muted);font-weight:600}
.opt[aria-pressed=true]{border-color:var(--gold);background:#26190a}
.opt[aria-pressed=true] .dot{background:var(--gold);border-color:var(--gold);box-shadow:inset 0 0 0 3.5px #26190a}
.bsum{position:sticky;bottom:var(--cartbar-h);z-index:5;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:12px 14px;margin-bottom:24px;border-radius:14px;background:var(--gold);color:#000}
.bsum b{display:block;font:700 28px/1 var(--label);font-variant-numeric:tabular-nums}
.bsum .lbl{color:#3a2800}
.bsum .btn{background:#000;color:var(--cream)}

/* barra do carrinho */
.cartbar{position:fixed;left:0;right:0;bottom:0;z-index:35;padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:linear-gradient(to top,#000 72%,rgba(0,0,0,0))}
.cb{display:flex;justify-content:space-between;align-items:center;width:100%;max-width:1048px;margin:0 auto;min-height:52px;padding:0 20px;border:0;border-radius:999px;background:var(--red);color:var(--cream);font:700 17px/1 var(--label);letter-spacing:.07em;text-transform:uppercase}
.cb b{font-size:20px;font-variant-numeric:tabular-nums}

/* rodapé */
.foot{border-top:1px solid var(--line);margin-top:12px;padding-block:28px 130px;color:var(--muted)}
.foot .wrap{display:grid;gap:22px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.foot h4{font:700 13px/1 var(--label);letter-spacing:.18em;text-transform:uppercase;color:var(--gold);margin:0 0 8px}
.foot p{margin:0 0 4px}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{display:inline-flex;align-items:center;min-height:38px;padding:0 15px;border:1.5px solid var(--gold);border-radius:99px;color:var(--cream);text-decoration:none;font:700 15px/1 var(--label);letter-spacing:.07em;text-transform:uppercase}

/* telas cheias */
.sheet{position:fixed;inset:0;z-index:60;background:var(--black);overflow-y:auto;overscroll-behavior:contain;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet-top{position:sticky;top:0;z-index:3;background:var(--black);border-bottom:1px solid var(--line)}
.sheet-top .wrap{display:flex;align-items:center;gap:10px;min-height:58px;flex-wrap:wrap;padding-block:8px}
.sheet-top h2{margin:0;font:400 19px/1.1 var(--display)}
.sheet-body{display:grid;gap:26px;padding-block:20px 80px;max-width:780px;margin:0 auto}
.sheet-body.wide{max-width:1000px}
.blk-h{margin:0 0 12px;font:400 18px/1.1 var(--display)}
.lines{display:grid;gap:10px}
.line{display:grid;gap:10px;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--coal)}
.line-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.line h3{margin:0;font:400 16px/1.2 var(--display)}
.line ul{margin:6px 0 0;padding-left:18px;color:var(--muted);font-size:14px}
.line-bot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.rm{background:none;border:0;color:var(--muted);text-decoration:underline;font-size:14.5px;min-height:40px;padding:0 4px}
.total{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-top:14px;font:700 17px/1 var(--label);letter-spacing:.08em;text-transform:uppercase}
.total b{font-size:32px;color:var(--gold);font-variant-numeric:tabular-nums}
.fld{display:grid;gap:6px;min-width:0}
.in{width:100%;min-height:46px;padding:10px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--coal);color:var(--cream);font-size:16px}
.in:focus-visible{outline:3px solid var(--gold);outline-offset:1px;border-color:var(--gold)}
select.in{appearance:auto}
.cols{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr))}
.stack{display:grid;gap:12px}
.seg{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(120px,1fr))}
.seg button{min-height:50px;padding:6px 10px;border-radius:12px;border:1.5px solid var(--line);background:var(--coal);font:700 15.5px/1.1 var(--label);letter-spacing:.06em;text-transform:uppercase}
.seg button[aria-pressed=true]{background:var(--gold);border-color:var(--gold);color:#000}
.err{border:1.5px solid var(--bad);background:#2a1212;border-radius:12px;padding:12px 14px;color:#ffd6d6;font-size:15px}
.err ul{margin:6px 0 0;padding-left:18px}
.okbox{border:1.5px solid #2f6b47;background:#0f2017;border-radius:12px;padding:12px 14px;color:#c9f2d8;font-size:15px}
.cta-stack{display:grid;gap:10px}
textarea.in{min-height:84px;resize:vertical}

/* administração */
.chip{display:inline-flex;align-items:center;gap:8px;min-height:32px;padding:0 12px;border-radius:99px;border:1.5px solid var(--line);font:700 13.5px/1 var(--label);letter-spacing:.09em;text-transform:uppercase}
.chip.pend{border-color:var(--gold);color:var(--gold)}
.chip.ok{border-color:#2f6b47;color:var(--good)}
.atabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.atabs::-webkit-scrollbar{display:none}
.acard{display:grid;gap:12px;padding:14px;background:var(--coal);border:1px solid var(--line);border-radius:14px}
.acard h3{margin:0;font:400 17px/1.15 var(--display)}
.arow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.chk{display:inline-flex;align-items:center;gap:9px;min-height:40px;font-size:15.5px}
.chk input{width:20px;height:20px;accent-color:var(--gold)}
.opt-row{display:grid;gap:8px;grid-template-columns:minmax(0,1fr) 110px auto;align-items:end;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--black)}
.opt-row .arow{flex-wrap:nowrap}
.sample{border:1.5px solid var(--gold);border-radius:12px;padding:12px 14px;background:#201705;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;font-size:15px}
.msgline{font-size:14.5px;color:var(--muted);margin:0}
.msgline:empty{display:none}
.seg.seg3{grid-template-columns:repeat(3,minmax(0,1fr))}
.msgline.bad{color:var(--bad)}
.msgline.good{color:var(--good)}
@media (max-width:520px){.opt-row{grid-template-columns:minmax(0,1fr) 96px}.opt-row .arow{grid-column:1/-1}}
.card h3{font:700 18px/1.2 var(--body)}.sec-h h2{font:700 26px/1.1 var(--body)}.bgroup h3{font:700 18px/1.2 var(--body)}
.card.hasimg{grid-template-columns:96px minmax(0,1fr)}.card.hasimg .tile{width:96px;height:96px;overflow:hidden}.tile img{width:100%;height:100%;object-fit:cover}
.home{padding-top:16px;padding-bottom:140px;display:grid;gap:12px}
.hh{position:relative;overflow:hidden;border-radius:22px;padding:22px 18px;min-height:320px;display:grid;align-content:end;gap:10px;background:#1b1210 center/cover;border:1.5px solid var(--gold-d)}
.hh .mas{position:absolute;right:-6px;top:10px;width:46%;max-width:200px}
.hh h1{font:400 clamp(28px,8vw,40px)/1.05 var(--display);margin:0;position:relative;max-width:11ch}

.hc{border-radius:18px;padding:18px;min-height:132px;display:grid;align-content:center;justify-items:end;text-align:right;gap:6px;background:#241812 center/cover;border:1px solid var(--line)}
.hc h3{margin:0;font:700 21px/1.15 var(--body)}.hc p{margin:0;color:var(--muted);font-size:15px}
.hbtn{display:inline-flex;align-items:center;min-height:38px;padding:0 18px;margin-top:6px;border-radius:99px;border:0;background:var(--red);color:var(--cream);font:700 14.5px/1 var(--label);letter-spacing:.12em;text-transform:uppercase;text-decoration:none}
.hbtn.wa{background:#25d366;color:#000}
.hsec{padding:18px;border:1px solid var(--line);border-radius:18px;background:var(--coal);display:grid;gap:8px;scroll-margin-top:80px}.hsec h2{margin:0;font:700 22px var(--body)}.hsec p{margin:0;color:var(--muted)}
.mp-top{padding-block:12px 0}
.stats{display:grid;gap:10px;grid-template-columns:1fr 1fr}.stat{padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--coal);display:grid;gap:4px}
.stat.big{grid-column:1/-1;background:var(--gold);color:#000}.stat.big .lbl,.stat.big small{color:#3a2800}.stat b{font:700 30px/1 var(--label)}
.seg4{grid-template-columns:repeat(2,minmax(0,1fr))}
.thumb{width:64px;height:64px;flex:none;border-radius:10px;object-fit:cover;border:1px solid var(--line);background:var(--black)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}.cal>em{font:700 11px var(--label);color:var(--muted);text-align:center;font-style:normal}
.cd{min-height:58px;border:1px solid var(--line);border-radius:8px;padding:4px;display:grid;align-content:start;gap:1px;font-size:11px}.cd.has{background:#2a1c10;border-color:var(--gold-d)}.cd.now{outline:2px solid var(--gold)}.cd b{font-size:11px;color:var(--gold)}.cd small{color:var(--muted);font-size:10px}
.ab-img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:16px;display:block}.dif{display:grid;grid-template-columns:1fr 1fr;gap:10px}.dif div{padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--coal)}.dif b{display:block;color:var(--gold);font:700 13px var(--label);letter-spacing:.14em}.dif h3{margin:4px 0;font:700 17px/1.2 var(--body)}.dif p{margin:0;color:var(--muted);font-size:14px}.gal{display:grid;grid-template-columns:1fr 1fr;gap:8px}.gal img:first-child{grid-column:1/-1}.gal img{aspect-ratio:4/3;width:100%;object-fit:cover;border-radius:14px}

// Ita Burger — carrinho e pedido: linhas, totais, montagem ('monte o seu') e mensagem do WhatsApp
// Extraído de #ita-main (carrinho) no arquivo único.

function lineInfo(l){
  if(l.t==='p'){const p=S.products.find(x=>x.id===l.pid);if(!p||!p.on)return null;return{name:p.name,unit:Number(p.price)||0,detail:[]}}
  const b=S.builder;if(!b.on)return null;
  let unit=0;const detail=[];
  for(const g of b.groups){
    const ids=(l.picks&&l.picks[g.id])||[];
    const os=g.opts.filter(o=>ids.indexOf(o.id)>-1);
    if(g.required&&g.type==='single'&&g.opts.length&&!os.length)return null;
    if(os.length){detail.push(g.name+': '+os.map(o=>o.name).join(', '));os.forEach(o=>{unit+=Number(o.price)||0})}
  }
  return{name:b.title||'Monte o seu',unit:Math.round(unit*100)/100,detail};
}

function cleanCart(){CART=CART.filter(l=>l&&l.qty>0&&lineInfo(l))}

function cartCount(){return CART.reduce((a,l)=>a+l.qty,0)}

function cartTotal(){return Math.round(CART.reduce((a,l)=>{const i=lineInfo(l);return a+(i?i.unit*l.qty:0)},0)*100)/100}

function saveCart(){LS.set('ita-cart',JSON.stringify(CART))}

function saveOrder(){LS.set('ita-order',JSON.stringify(ORDER))}

function cartChanged(){
  cleanCart();saveCart();renderCartBar();renderCount();
  if(ui.tab!=='build')renderView();
  if(ui.cart){if(!CART.length||!$('#orderform'))renderCartSheet();else{renderCartLines();updateWa()}}
}

const plainLine=pid=>CART.find(x=>x.t==='p'&&x.pid===pid&&!x.note);

function addProduct(pid){const l=plainLine(pid);if(l)l.qty++;else CART.push({u:uid(),t:'p',pid,qty:1,note:''});cartChanged()}

function decProduct(pid){const l=plainLine(pid);if(!l)return;l.qty--;cartChanged()}

function initBP(){
  const keep={};
  S.builder.groups.forEach(g=>{
    let sel=(BP[g.id]||[]).filter(id=>g.opts.some(o=>o.id===id));
    if(g.type==='single')sel=sel.slice(0,1);
    if(g.required&&g.type==='single'&&!sel.length&&g.opts.length)sel=[g.opts[0].id];
    keep[g.id]=sel;
  });
  BP=keep;
}

function bTotal(){let t=0;S.builder.groups.forEach(g=>{g.opts.forEach(o=>{if((BP[g.id]||[]).indexOf(o.id)>-1)t+=Number(o.price)||0})});return Math.round(t*100)/100}

function buildMsg(){
  const L=[];
  L.push('*Novo pedido - '+(S.config.name||'Ita Burger')+'*','','*Itens*');
  CART.forEach(l=>{
    const i=lineInfo(l);if(!i)return;
    L.push(l.qty+'x '+i.name+' - '+brl(i.unit*l.qty));
    i.detail.forEach(d=>L.push('   • '+d));
    if(l.note)L.push('   Obs: '+l.note);
  });
  L.push('','*Subtotal dos itens:* '+brl(cartTotal()));
  if(ORDER.mode==='entrega'){if(curZone())L.push('*Taxa de entrega ('+curZone().name+'):* '+brl(deliv()));else L.push('_A taxa de entrega você me informa por aqui._')}
  L.push('*Total do pedido:* '+brl(grand()));
  L.push('','*Nome:* '+ORDER.name);
  if(ORDER.mode==='entrega'){
    L.push('*Entrega em:* '+ORDER.street+', nº '+ORDER.num);
    L.push('*Bairro:* '+ORDER.hood+(ORDER.city?' - '+ORDER.city:''));
    if(ORDER.comp)L.push('*Complemento:* '+ORDER.comp);
    if(ORDER.ref)L.push('*Referência:* '+ORDER.ref);
  }else L.push('*Retirada no balcão*');
  let pay=PAY[ORDER.pay]||'';
  if(ORDER.pay==='dinheiro')pay+=ORDER.change?' (troco para '+ORDER.change+')':' (sem troco)';
  L.push('*Pagamento:* '+pay);
  return L.join('\n');
}

function waUrl(){return 'https://wa.me/'+String(S.config.whatsapp||'').replace(/\D/g,'')+'?text='+encodeURIComponent(buildMsg())}

function validate(){
  const e=[];
  if(!CART.length)e.push(['','Adicione pelo menos um item.']);
  if(!ORDER.name.trim())e.push(['o-name','Informe o seu nome.']);
  if(ORDER.mode==='entrega'){
    if(!ORDER.street.trim())e.push(['o-street','Informe a rua ou avenida.']);
    if(!ORDER.num.trim())e.push(['o-num','Informe o número.']);
    if(zonesOn().length?!curZone():!ORDER.hood.trim())e.push(['o-hood','Escolha o bairro de entrega.']);
  }
  if(!ORDER.pay)e.push(['pay-first','Escolha a forma de pagamento.']);
  return e;
}

function hoodFld(){const z=zonesOn();if(!z.length)return `<label class="fld"><span class="lbl">Bairro</span><input class="in" id="o-hood" data-o="hood" value="${esc(ORDER.hood)}"></label>`;
  return `<label class="fld"><span class="lbl">Bairro</span><select class="in" id="o-hood" data-zone="1"><option value="">Escolha o bairro</option>${z.map(x=>`<option value="${esc(x.id)}"${x.id===ORDER.zone?' selected':''}>${esc(x.name)} · ${brl(x.fee)}</option>`).join('')}</select></label>`}

function logOrder(){const sig=buildMsg(),now=Date.now(),l=ORDERS[0];if(l&&l.sig===sig&&now-l.t<60000)return;
  const o={id:uid(),t:now,sig,name:ORDER.name,mode:ORDER.mode,hood:ORDER.mode==='entrega'?ORDER.hood:'',items:CART.map(x=>{const i=lineInfo(x);return i?x.qty+'x '+i.name:''}).filter(Boolean),sub:cartTotal(),fee:deliv(),total:grand(),pay:PAY[ORDER.pay]||'',st:'todo'};
  ORDERS.unshift(o);saveOrders();
  if(typeof sbInsertOrder==='function'&&sbOn)sbInsertOrder(o).catch(e=>console.warn('[ita] pedido no Supabase falhou:',e&&e.message))}

// Ita Burger — administração: CRUD, pedidos/financeiro, fotos, senha e salvar (Supabase ou publicar)

const dirty=()=>JSON.stringify(S)!==JSON.stringify(DATA);
const sbReady=()=>typeof sbOn!=='undefined'&&sbOn===true&&typeof sbSave==='function';

let draftT=null;
async function persistLocalOrRemote(){
  if(sbReady()){
    sbState.saving=true;updateStatus();
    try{await sbSave(S);DATA=clone(S);LS.del('ita-draft');say('Salvo no Supabase ✓','good')}
    catch(e){say('Não salvou no Supabase: '+(e&&e.message||e)+' — alteração continua como rascunho neste aparelho.','bad')}
    updateStatus();return;
  }
  if(dirty())LS.set('ita-draft',JSON.stringify(S));else LS.del('ita-draft');
  updateStatus();
}
function touch(){clearTimeout(draftT);draftT=setTimeout(persistLocalOrRemote,400);updateStatus()}
async function flushSave(){clearTimeout(draftT);return persistLocalOrRemote()}

function updateStatus(){
  const d=dirty();
  const saving=sbState&&sbState.saving;
  const err=sbState&&sbState.error;
  const chip=$('#adstatus');chip.hidden=!ui.unlocked;chip.className='chip '+(d||saving||err?'pend':'ok');
  chip.textContent=saving?'Salvando no Supabase…':err?'Erro ao salvar':'…';
  if(!saving&&!err)chip.textContent=sbReady()?(d?'Alterações não salvas':'Salvo no Supabase'):(d?'Alterações não publicadas':'Tudo publicado');
  const btn=$('#btn-publish');btn.hidden=!ui.unlocked;btn.disabled=!d&&!saving;if(sbReady())btn.textContent='Salvar no Supabase';
  $('#btn-logout').hidden=!ui.unlocked;
  const bar=$('#draftbar');const show=d&&!ui.admin;bar.hidden=!show;
  if(show)bar.innerHTML='<div class="wrap"><span>'+(sbReady()?'Você tem alterações não salvas no Supabase.':'Você está vendo uma prévia com alterações que ainda não foram publicadas.')+'</span><button class="btn btn-line btn-sm" data-act="admin" style="border-color:var(--cream)">Abrir administração</button></div>';
}

const say=(t,cls)=>{const m=$('#admmsg');if(m){m.textContent=t;m.className='msgline '+(cls||'')}};

function fText(label,col,id,f,val,o){o=o||{};return `<label class="fld"><span class="lbl">${label}</span><input class="in" id="b-${col}-${id}-${f}" data-col="${col}" data-id="${id}" data-f="${f}"${o.t?' data-t="'+o.t+'"':''}${o.gid?' data-gid="'+o.gid+'"':''} value="${esc(val)}"${o.ph?' placeholder="'+esc(o.ph)+'"':''}${o.mode?' inputmode="'+o.mode+'"':''}></label>`}

function fSel(label,col,id,f,val,opts,o){o=o||{};return `<label class="fld"><span class="lbl">${label}</span><select class="in" id="b-${col}-${id}-${f}" data-col="${col}" data-id="${id}" data-f="${f}"${o.gid?' data-gid="'+o.gid+'"':''}>${opts.map(x=>`<option value="${esc(x[0])}"${x[0]===val?' selected':''}>${esc(x[1])}</option>`).join('')}</select></label>`}

function fChk(label,col,id,f,val,o){o=o||{};return `<label class="chk"><input type="checkbox" id="b-${col}-${id}-${f}" data-col="${col}" data-id="${id}" data-f="${f}" data-t="bool"${o.gid?' data-gid="'+o.gid+'"':''}${val?' checked':''}>${label}</label>`}

function cfgText(label,path,val,o){o=o||{};return `<label class="fld"><span class="lbl">${label}</span><input class="in" id="c-${path.replace('.','-')}" data-cfg="${path}"${o.t?' data-t="'+o.t+'"':''} value="${esc(val)}"${o.ph?' placeholder="'+esc(o.ph)+'"':''}${o.mode?' inputmode="'+o.mode+'"':''}></label>`}

const mvBtns=(col,id,gid)=>`<button class="btn btn-line btn-sm" data-act="mv" data-col="${col}" data-id="${id}" data-d="-1"${gid?' data-gid="'+gid+'"':''} aria-label="Mover para cima">↑</button><button class="btn btn-line btn-sm" data-act="mv" data-col="${col}" data-id="${id}" data-d="1"${gid?' data-gid="'+gid+'"':''} aria-label="Mover para baixo">↓</button>`;

  const inM=(d,Y,M)=>d.getFullYear()===Y&&d.getMonth()===M;let tot=0,cnt=0,pt=0;const day={};
  ORDERS.forEach(o=>{const d=new Date(o.t),v=Number(o.total)||0;if(inM(d,y,m)){const k=d.getDate();day[k]=day[k]||{v:0,n:0};day[k].v+=v;day[k].n++;tot+=v;cnt++}else if(inM(d,pm.getFullYear(),pm.getMonth()))pt+=v});
  const first=new Date(y,m,1).getDay(),dim=new Date(y,m+1,0).getDate(),now=new Date(),nm=new Date(y,m,1).toLocaleDateString('pt-BR',{month:'long',year:'numeric'});

  <div class="cal">${['D','S','T','Q','Q','S','S'].map(x=>`<em>${x}</em>`).join('')}${cells}</div>

function mv(col,id,d,gid){
  let arr,same=()=>true;
  if(col==='products'){arr=S.products;const p=arr.find(x=>x.id===id);if(!p)return;same=x=>x.cat===p.cat}
  else if(col==='cats')arr=S.cats;else if(col==='links')arr=S.links;else if(col==='ads')arr=S.ads;
  else if(col==='groups')arr=S.builder.groups;else if(col==='zones')arr=S.zones;
  else if(col==='opts'){const g=S.builder.groups.find(x=>x.id===gid);arr=g&&g.opts}
  if(!arr)return;
  const i=arr.findIndex(x=>x.id===id);let j=i+d;
  while(j>=0&&j<arr.length&&!same(arr[j]))j+=d;
  if(i<0||j<0||j>=arr.length)return;
  const t=arr[i];arr[i]=arr[j];arr[j]=t;
}

function doDel(col,id,gid){
  if(col==='products')S.products=S.products.filter(x=>x.id!==id);
  else if(col==='cats'){S.cats=S.cats.filter(x=>x.id!==id);S.products=S.products.filter(x=>x.cat!==id);if(ui.filter===id)ui.filter='all'}
  else if(col==='links')S.links=S.links.filter(x=>x.id!==id);
  else if(col==='ads')S.ads=S.ads.filter(x=>x.id!==id);else if(col==='zones')S.zones=S.zones.filter(x=>x.id!==id);else if(col==='orders'){ORDERS=ORDERS.filter(x=>x.id!==id);saveOrders();if(typeof sbDeleteOrder==='function'&&sbOn)sbDeleteOrder(id).catch(e=>console.warn('[ita] delete pedido falhou:',e&&e.message))}
  else if(col==='groups')S.builder.groups=S.builder.groups.filter(x=>x.id!==id);
  else if(col==='opts'){const g=S.builder.groups.find(x=>x.id===gid);if(g)g.opts=g.opts.filter(x=>x.id!==id)}
}

function findItem(col,id,gid){
  if(col==='products')return S.products.find(x=>x.id===id);
  if(col==='cats')return S.cats.find(x=>x.id===id);
  if(col==='links')return S.links.find(x=>x.id===id);
  if(col==='ads')return S.ads.find(x=>x.id===id);
  if(col==='zones')return S.zones.find(x=>x.id===id);
  if(col==='groups')return S.builder.groups.find(x=>x.id===id);
  if(col==='opts'){const g=S.builder.groups.find(x=>x.id===gid);return g&&g.opts.find(x=>x.id===id)}
}

const JS_FILES=['js/utils.js','js/supabase-config.js','js/supabase.js','js/assets.js','js/data.js','js/state.js','js/cart.js','js/render.js','js/admin.js','js/actions.js','js/main.js'];
async function fetchText(url){const r=await fetch(url);if(!r.ok)throw new Error('Não consegui carregar '+url);return r.text()}
async function imgDataUrl(url){if(url.startsWith('data:'))return url;const buf=await (await fetch(url)).arrayBuffer();const bytes=new Uint8Array(buf);let bin='';for(let i=0;i<bytes.length;i+=8192)bin+=String.fromCharCode.apply(null,Array.from(bytes.subarray(i,i+8192)));return 'data:image/jpeg;base64,'+btoa(bin)}
async function getResetAsync(){const inline=getReset();if(inline&&inline.length>0){try{const r=await fetch('css/reset.css');if(r.ok)return await r.text()}catch(e){}}return inline}
async function buildDoc(state){
  const data=JSON.stringify(state).replace(/</g,'\\u003c');
  const reset=await getResetAsync();
  let css='',main='';
  const cssEl=document.querySelector('#ita-css'),mainEl=document.querySelector('#ita-main');
  if(cssEl&&cssEl.textContent.trim())css=cssEl.textContent;
  else css=await fetchText('css/style.css');
  if(mainEl&&mainEl.textContent.trim())main=mainEl.textContent;
  else{
    const parts=[];
    for(const f of JS_FILES){
      let t=await fetchText(f);
      if(f==='js/assets.js'){
        for(const k in IMG){
          try{const dataUrl=await imgDataUrl(IMG[k]);t=t.split('"'+IMG[k]+'"').join('"'+dataUrl+'"')}catch(e){}
        }
      }
      parts.push(t);
    }
    main=parts.join('\n');
  }
  const fontsEl=document.querySelector('#ita-fonts');
  const fontsHtml=fontsEl?fontsEl.outerHTML:'<link id="ita-fonts" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&family=Bowlby+One&display=swap">';
  const sbHtml='<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></scr'+'ipt>';
  return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>'+reset+'</style></head><body>'+
  '<title>Ita Burger</title><meta name="claude:viewport-fit-sides" content="cover">'+fontsHtml+sbHtml+
  '<style id="ita-css">'+css+'</style><div id="app"></div>'+
  '<script type="application/json" id="ita-data">'+data+'<\/script><script id="ita-main">'+main+'<\/script></body></html>';
}
async function doPublish(){
  const btn=$('#btn-publish');
  if(sbReady()){
    btn.disabled=true;say('Salvando no Supabase…');
    try{await flushSave();say('Salvo no Supabase ✓','good')}
    catch(e){say('Não salvou: '+(e&&e.message||e),'bad')}
    btn.disabled=false;updateStatus();return;
  }
  let art=null;
  try{art=window.claude&&window.claude.use?await window.claude.use('artifact'):null}catch(e){}
  if(!art){say('Publicar não está disponível nesta tela. Abra o site pelo link original, logado na sua conta, e tente de novo.','bad');return}
  const next=clone(S);next.v=(DATA.v||1)+1;
  btn.disabled=true;say('Publicando…');
  try{
    SS.set('ita-pub',String(next.v));SS.set('ita-reopen','1');
    await art.publish(await buildDoc(next));
    say('Publicado. A página vai recarregar.','good');
  }catch(e){
    SS.del('ita-pub');SS.del('ita-reopen');btn.disabled=false;
    const c=e&&e.code;
    say(c==='not_writer'||c==='not_granted'||c==='consent_required'?'Esta conta só pode ver o site. Peça permissão de edição ao dono para publicar.':
        c==='conflict'?'Outra versão foi publicada antes. A página vai recarregar com ela. Refaça a alteração se precisar.':
        c==='rate_limited'?'Muitas publicações seguidas. Espere um minuto e tente de novo.':
        c==='too_large'?'O site ficou grande demais para publicar.':
        'Não foi possível publicar agora. Suas alterações continuam salvas como rascunho.','bad');
  }
}

    if(!g||!n||!n.value.trim()){say('Dê um nome à opção.','bad');if(n)n.focus();return}
    g.opts.push({id:uid(),name:n.value.trim(),price:parseMoney($('#no-price-'+el.dataset.gid).value)});struct('Opção adicionada.');
  },
  addad(){
    const t=$('#na-text').value.trim();if(!t){say('Escreva o texto do anúncio.','bad');$('#na-text').focus();return}
    S.ads.push({id:uid(),text:t,url:$('#na-url').value.trim(),on:true});struct('Anúncio adicionado.');
  },
  addlink(){
    const l=$('#nl-label').value.trim();if(!l){say('Dê um nome ao link.','bad');$('#nl-label').focus();return}
    S.links.push({id:uid(),label:l,url:$('#nl-url').value.trim(),on:true});struct('Link adicionado.');
  },
  mv(el){mv(el.dataset.col,el.dataset.id,Number(el.dataset.d),el.dataset.gid);struct()},
  del(el){
    if(el.dataset.armed!=='1'){
      el.dataset.armed='1';el.dataset.t0=el.textContent;el.textContent=el.dataset.warn;
      setTimeout(()=>{if(el.isConnected&&el.dataset.armed==='1'){el.dataset.armed='';el.textContent=el.dataset.t0}},4000);return;
    }
    doDel(el.dataset.col,el.dataset.id,el.dataset.gid);struct('Excluído.');
  }
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;const f=ACT[el.dataset.act];if(f)f(el,e)});

function readImg(file,R,cb){const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const tr=R[0]/R[1];let sw=im.width,sh=im.height;if(sw/sh>tr)sw=sh*tr;else sh=sw/tr;const W=Math.min(R[2],Math.round(sw)),H=Math.round(W/tr),c=document.createElement('canvas');c.width=W;c.height=H;c.getContext('2d').drawImage(im,(im.width-sw)/2,(im.height-sh)/2,sw,sh,0,0,W,H);cb(c.toDataURL('image/jpeg',.82))};im.onerror=()=>say('Não consegui ler essa foto.','bad');im.src=r.result};r.readAsDataURL(file)}
document.addEventListener('change',e=>{const t=e.target;if(!t.dataset||!t.dataset.img||!t.files||!t.files[0])return;const [k,id]=t.dataset.img.split(':');
  const rk=k==='slot'?(SLOTS.find(x=>x[0]===id)||[])[2]:'prod';readImg(t.files[0],RATIO[rk]||RATIO.prod,src=>{if(k==='np'){ui.npImg=src;const pv=$('#np-prev');if(pv)pv.innerHTML='<img class="thumb" src="'+src+'" alt="">'}else if(k==='prod'){const p=S.products.find(x=>x.id===id);if(p)p.img=src;struct('Foto salva.')}else{S.photos[id]={src,on:true};struct('Foto salva.')}})});

function onInput(e){
  const t=e.target;
  if(t.dataset.zone!==undefined){const z=S.zones.find(x=>x.id===t.value);ORDER.zone=z?z.id:'';ORDER.hood=z?z.name:'';saveOrder();renderCartLines();updateWa();return}
  if(t.dataset.o!==undefined){ORDER[t.dataset.o]=t.value;saveOrder();updateWa();return}
  if(t.dataset.note){const l=CART.find(x=>x.u===t.dataset.note);if(l){l.note=t.value;saveCart();updateWa()}return}
  if(t.dataset.filter){ui.filter=t.value;renderAdmin();return}
  if(t.dataset.cfg){
    let v=t.dataset.t==='bool'?t.checked:t.value;
    if(t.dataset.t==='phone'){v=normPhone(t.value);if(e.type==='change')t.value=fmtPhone(v)}
    setPath(S,t.dataset.cfg,v);touch();return;
  }
  if(t.dataset.col){
    const it=findItem(t.dataset.col,t.dataset.id,t.dataset.gid);if(!it)return;
    let v;
    if(t.dataset.t==='bool')v=t.checked;
    else if(t.dataset.t==='money'){v=parseMoney(t.value);if(e.type==='change')t.value=fmtMoney(v)}
    else v=t.value;
    it[t.dataset.f]=v;touch();
  }
}
document.addEventListener('input',onInput);
document.addEventListener('change',onInput);

document.addEventListener('submit',async e=>{
  const f=e.target;e.preventDefault();
  if(f.id==='loginform'){
    const err=$('#loginerr');err.textContent='';
    if(!(window.crypto&&crypto.subtle)){err.textContent='Este navegador não consegue verificar a senha.';return}
    if(ui.tries>=3){await new Promise(r=>setTimeout(r,1500))}
    const ok=(await sha(S.pw.salt+':'+$('#pw').value))===S.pw.hash;
    if(ok){ui.unlocked=true;ui.tries=0;SS.set('ita-admin','1');renderAdmin()}
    else{ui.tries++;err.textContent='Senha incorreta.';$('#pw').select()}
  }
  if(f.id==='pwform'){
    const o=$('#pw-old').value,n=$('#pw-new').value,n2=$('#pw-new2').value;
    if((await sha(S.pw.salt+':'+o))!==S.pw.hash)return say('A senha atual não confere.','bad');
    if(n.length<6)return say('A nova senha precisa ter pelo menos 6 caracteres.','bad');
    if(n!==n2)return say('As duas senhas novas são diferentes.','bad');
    const salt='ita-'+uid();S.pw={salt,hash:await sha(salt+':'+n)};touch();
    ['#pw-old','#pw-new','#pw-new2'].forEach(s=>{$(s).value=''});
    say('Senha trocada no rascunho. Publique para valer para todos.','good');
  }
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(ui.admin)closeAdmin();else if(ui.cart)closeCart()}});



// Ita Burger — inicialização
// Tenta Supabase primeiro (se configurado), senão usa o rascunho local / JSON empacotado.

(async function(){
  shell();
  if(typeof sbLoad==='function'&&sbOn){
    try{
      const remote=await sbLoad();
      if(remote&&remote.v!==undefined){DATA=remote;S=clone(DATA);normState();LS.del('ita-draft');SS.del('ita-pub')}
    }catch(e){console.warn('[ita] Supabase load falhou, usando dados locais:',e&&e.message)}
    try{
      const list=await sbListOrders();
      if(Array.isArray(list)&&list.length){ORDERS=list;saveOrders()}
    }catch(e){console.warn('[ita] Supabase orders load falhou:',e&&e.message)}
  }
  cleanCart();saveCart();initBP();renderAll();
  const pb=document.querySelector('#btn-publish');if(pb&&sbOn)pb.textContent='Salvar no Supabase';
  setInterval(()=>{if(S.ads.filter(a=>a.on&&String(a.text).trim()).length>1){adIdx++;renderAds()}},5000);
  if(typeof sbListOrders==='function'&&sbOn)setInterval(async ()=>{
    if(document.hidden)return;
    try{
      const list=await sbListOrders();
      if(!Array.isArray(list))return;
      const sig=list.length+':'+(list[0]?list[0].id+list[0].st+list[0].t:'');
      const cur=ORDERS.length+':'+(ORDERS[0]?ORDERS[0].id+ORDERS[0].st+ORDERS[0].t:'');
      if(sig!==cur){ORDERS=list;saveOrders();if(ui.admin&&(ui.atab==='orders'||ui.atab==='fin'))renderAdmin()}
    }catch(e){}
  },10000);
  if(SS.get('ita-reopen')==='1'){SS.del('ita-reopen');openAdmin()}
})();

})();
